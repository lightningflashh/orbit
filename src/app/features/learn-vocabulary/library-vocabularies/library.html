<div class="min-h-screen bg-[#030712] pt-24 pb-12 px-6">
  <div class="max-w-6xl mx-auto mb-12 text-center">
    <h2 class="text-4xl font-black text-white uppercase italic tracking-tighter mb-4">
      Vocabulary <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Library</span>
    </h2>
    
    <div class="relative max-w-2xl mx-auto mt-8">
      <input type="text" 
             (input)="onSearch($event)"
             placeholder="Search for new mission data (words)..."
             class="w-full px-6 py-4 bg-white/5 border border-white/10 rounded-2xl text-white outline-none focus:border-cyan-500 focus:ring-4 focus:ring-cyan-500/10 transition-all">
      <div class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
    </div>
  </div>

  <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (vocab of filteredVocabs; track vocab.id) {
      <div class="group relative p-6 bg-white/[0.02] border border-white/10 rounded-[2rem] hover:bg-white/[0.05] hover:border-cyan-500/50 transition-all duration-300 shadow-xl">
        
        <div class="flex justify-between items-start mb-4">
          <div>
            <span class="text-[10px] font-bold text-cyan-500 uppercase tracking-[0.2em] mb-1 block">Identifier: #{{vocab.id}}</span>
            <h3 class="text-2xl font-black text-white italic tracking-tight">{{vocab.word}}</h3>
          </div>
          <span class="px-3 py-1 bg-cyan-500/10 text-cyan-400 text-[10px] font-bold rounded-full border border-cyan-500/20 uppercase">
            {{vocab.type || 'Noun'}}
          </span>
        </div>

        <p class="text-slate-400 text-sm leading-relaxed mb-6 line-clamp-2">
          {{vocab.definition}}
        </p>

        <button (click)="addToMyMission(vocab.id)"
                class="w-full py-3 bg-white/5 border border-white/10 text-white text-xs font-black rounded-xl uppercase tracking-widest group-hover:bg-gradient-to-r group-hover:from-cyan-600 group-hover:to-blue-600 group-hover:border-transparent transition-all active:scale-95 flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Add to Mission
        </button>

        <div class="absolute -inset-px bg-gradient-to-r from-cyan-500 to-blue-500 rounded-[2rem] opacity-0 group-hover:opacity-10 blur-xl transition-opacity -z-10"></div>
      </div>
    }
  </div>
</div>
