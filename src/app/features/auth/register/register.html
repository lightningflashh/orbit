<div class="min-h-screen pt-32 pb-12 flex items-center justify-center bg-[#030712] px-4 relative overflow-hidden">
  <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-[120px]"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-pink-500/20 rounded-full blur-[120px]"></div>

  <div class="max-w-md w-full p-10 bg-white/[0.02] backdrop-blur-2xl rounded-3xl border border-white/10 shadow-2xl z-10">
    <div class="text-center mb-8">
      <h2 class="text-4xl font-black tracking-tighter text-white uppercase italic leading-tight">
        Join the <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">Orbit</span>
      </h2>
      <p class="mt-2 text-sm text-gray-400 font-medium">Create an account to start your mission.</p>
    </div>

    <form class="space-y-4">
      <input type="text" placeholder="Username"
        class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-slate-500 outline-none focus:border-purple-500 transition-all">
      
      <input type="email" placeholder="Email Address"
        class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-slate-500 outline-none focus:border-purple-500 transition-all">

      <div class="relative">
        <input [type]="showPassword ? 'text' : 'password'" placeholder="Password"
          class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-slate-500 outline-none focus:border-purple-500 transition-all">
        <button type="button" (click)="showPassword = !showPassword" 
          class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-purple-400 transition-colors">
          <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
          </svg>
        </button>
      </div>

      <div class="relative">
        <input [type]="showConfirmPassword ? 'text' : 'password'" placeholder="Confirm Password"
          class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-slate-500 outline-none focus:border-purple-500 transition-all">
        <button type="button" (click)="showConfirmPassword = !showConfirmPassword" 
          class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-purple-400 transition-colors">
          <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
          </svg>
        </button>
      </div>

      <button type="submit"
        class="w-full py-4 mt-4 bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-500 hover:to-pink-400 text-white font-bold rounded-2xl shadow-[0_10px_20px_rgba(168,85,247,0.3)] transition-all active:scale-95">
        CREATE ACCOUNT
      </button>

      <div class="text-center mt-6">
        <p class="text-slate-500 text-sm">
          Already have an account? 
          <a routerLink="/login" class="text-purple-400 font-bold hover:text-purple-300 transition-colors">Sign in</a>
        </p>
      </div>
    </form>
  </div>
</div>
