<div class="fixed bottom-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div [class]="getClasses(toast.type)" 
         class="min-w-[320px] p-4 rounded-2xl border backdrop-blur-xl shadow-2xl flex items-center justify-between animate-slide-in pointer-events-auto">
      
      <div class="flex items-center gap-3">
        <div [class]="getIconBg(toast.type)" 
             class="w-8 h-8 rounded-full flex items-center justify-center shadow-lg text-sm font-bold">
           @if(toast.type === 'success') {
             <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
               <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
             </svg>
           } @else if(toast.type === 'error') {
             <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
               <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
             </svg>
           } @else {
             <span>i</span>
           }
        </div>

        <span class="text-sm font-bold text-white uppercase tracking-tight leading-none">
          {{ toast.message }}
        </span>
      </div>

      <button (click)="toastService.remove(toast.id)" 
              class="ml-4 text-white/30 hover:text-white transition-colors duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
