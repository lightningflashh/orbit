<header class="w-full bg-transparent not-even:backdrop-blur-xl border-b border-b-gray-700/10 fixed top-0 z-50">
  <div class="max-w-7xl mx-auto px-8">
    <div class="flex justify-between items-center h-24">
      
      <div class="flex items-center group cursor-pointer" routerLink="/">

        <div class="flex flex-col">
          <h1 class="text-4xl font-extrabold tracking-tighter text-white uppercase italic leading-none">
            Orb<span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">it.</span>
          </h1>
          <div class="flex items-center space-x-2 mt-1">
            <span class="h-[1px] w-8 bg-indigo-500/50"></span>
            <span class="text-[10px] font-black tracking-[0.5em] text-slate-400 uppercase">Aerospace</span>
          </div>
        </div>
      </div>

      <div class="flex items-center space-x-6">
        @if (authService.currentUser(); as user) {
          <div class="relative">
            <button (click)="toggleDropdown()" 
                    class="flex items-center space-x-3 px-3 py-1.5 bg-white/5 border border-white/10 rounded-full hover:bg-white/10 transition-all active:scale-95 shadow-[0_0_15px_rgba(99,102,241,0.1)]">
              
              <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center overflow-hidden border border-white/20">
                @if (user.imageUrl) {
                  <img [src]="user.imageUrl" alt="Avatar" class="w-full h-full object-cover">
                } @else {
                  <i class="fas fa-user-astronaut text-white text-[12px]"></i>
                }
              </div>

              <span class="text-sm font-bold text-slate-200 pr-2">@{{ user.login }}</span>
              <i class="fas fa-chevron-down text-[10px] text-slate-500 transition-transform duration-300" [class.rotate-180]="isProfileOpen"></i>
            </button>

            @if (isProfileOpen) {
              <div class="absolute right-0 mt-4 w-64 bg-[#0b101f]/95 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.6)] py-3 z-[60] overflow-hidden">
                
                <div class="px-6 py-4 border-b border-white/5 bg-indigo-500/[0.03] mb-2">
                  <p class="text-[10px] font-black text-indigo-400 uppercase tracking-[0.2em] mb-1">Space Pilot</p>
                  <p class="text-sm font-bold text-white truncate">{{ user.firstName }} {{ user.lastName }}</p>
                  <p class="text-[10px] text-slate-500 truncate mt-0.5 italic">{{ user.email }}</p>
                </div>

                <div class="px-2">
                  <a routerLink="/topics/my" (click)="isProfileOpen = false"
                     class="flex items-center space-x-3 px-4 py-3 rounded-2xl text-slate-400 hover:text-white hover:bg-white/5 transition-all group">
                    <div class="w-8 h-8 rounded-xl bg-slate-800 flex items-center justify-center group-hover:bg-indigo-500/20 group-hover:text-indigo-400 transition-colors">
                      <i class="fas fa-layer-group text-sm"></i>
                    </div>
                    <span class="text-sm font-bold">My Library</span>
                  </a>

                  <a routerLink="/settings" (click)="isProfileOpen = false"
                     class="flex items-center space-x-3 px-4 py-3 rounded-2xl text-slate-400 hover:text-white hover:bg-white/5 transition-all group">
                    <div class="w-8 h-8 rounded-xl bg-slate-800 flex items-center justify-center group-hover:bg-indigo-500/20 group-hover:text-indigo-400 transition-colors">
                      <i class="fas fa-sliders-h text-sm"></i>
                    </div>
                    <span class="text-sm font-bold">Settings</span>
                  </a>
                </div>

                <div class="h-[1px] bg-white/5 my-2 mx-4"></div>

                <div class="px-2">
                  <button (click)="onLogout()" 
                          class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 transition-all group">
                    <div class="w-8 h-8 rounded-xl bg-rose-500/10 flex items-center justify-center group-hover:bg-rose-500/20 transition-colors">
                      <i class="fas fa-power-off text-sm"></i>
                    </div>
                    <span class="text-sm font-black uppercase tracking-widest">Logout</span>
                  </button>
                </div>
              </div>

              <div class="fixed inset-0 z-[-1]" (click)="isProfileOpen = false"></div>
            }
          </div>
        } @else {
          <button routerLink="/login" 
                  class="relative inline-flex items-center justify-center px-8 py-3 font-black text-white bg-indigo-600 rounded-full shadow-[0_0_20px_rgba(79,70,229,0.4)] hover:shadow-indigo-500/60 active:scale-95 transition-all uppercase tracking-tighter text-sm">
              Get Started
          </button>
        }
      </div>

    </div>
  </div>
</header>
